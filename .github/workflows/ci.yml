# Tests, build, browser tests, migrations and security checks on every push and pull request.
# No production secret is used anywhere here: every key is generated per run or is a fixed test value.
# Actions are pinned to full commit SHAs (Dependabot keeps them current).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: vaulta, POSTGRES_DB: vaulta_test, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U vaulta" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://vaulta@localhost:54329/vaulta_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: "backend/requirements*.txt" }
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: pytest (includes migrations up/down/up, RLS, encryption, log checks)
        working-directory: backend
        run: python -m pytest -q
      - name: Migrations up, down, up and no drift, on a fresh database
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: "{}"
        run: |
          psql -h localhost -p 54329 -U vaulta -d postgres -c "CREATE DATABASE vaulta_migrate"
          export DATABASE_URL=postgresql://vaulta@localhost:54329/vaulta_migrate
          MASTER_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
          BLIND_INDEX_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
          export MASTER_KEY BLIND_INDEX_KEY
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check

  frontend:
    name: Frontend lint, unit tests, build
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Production build (fails if vercel.json's CSP doesn't allow the API)
        env:
          VITE_API_BASE_URL: https://api.vaulta.in
          VITE_FIREBASE_API_KEY: ci
          VITE_FIREBASE_AUTH_DOMAIN: vaulta.in
          VITE_FIREBASE_PROJECT_ID: vaulta-a3d7a
          VITE_FIREBASE_APP_ID: "1:0:web:ci"
          VITE_SECURITY_CONTACT: security@vaulta.example
          VITE_PRIVACY_CONTACT: privacy@vaulta.example
        run: npm run build
      - name: No Vercel, Render or Firebase default host in the app, emails or Telegram messages
        run: ../scripts/check-default-domains.sh frontend/dist

  worker:
    name: Email worker tests
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: infra/email-worker } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: infra/email-worker/package-lock.json }
      - run: npm ci
      - run: npm test

  ml:
    name: Merchant model data (deterministic) and split leakage
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: ml } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: "ml/requirements.txt" }
      - run: pip install -r requirements.txt
      - name: Regenerate the synthetic data (must match the committed summary exactly)
        run: python prepare_real.py && python generate.py && git diff --exit-code artifacts/data_summary.json
      - name: Split leakage and stripping tests
        run: python -m pytest -q tests

  e2e:
    name: Browser tests (Chromium, Firefox, WebKit, devices; Firebase Auth emulator, fake LLM)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: vaulta, POSTGRES_DB: postgres, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U vaulta" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_PYTHON: python
      E2E_DATABASE_URL: postgresql://vaulta@localhost:54329/vaulta_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: "backend/requirements*.txt" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "21" }    # the Firebase emulator
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend
      - name: Playwright, every project (Chromium, Firefox, WebKit, iPhone WebKit, and the device profiles)
        run: npx playwright test
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: playwright-results, path: frontend/test-results, retention-days: 7 }

  security:
    name: Security checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }                # the secret check reads every version of every file
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep linux_x64.tar.gz gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks && sudo mv gitleaks /usr/local/bin/
          rm gitleaks_8.30.1_*
      - name: Secrets and personal data in the full history
        run: scripts/secret-check.sh HEAD
      - name: Install audit tools
        run: pip install pip-audit==2.10.0 bandit==1.9.4 semgrep==1.178.0
      - name: pip-audit (fails on any known vulnerability)
        run: pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: npm audit (fails on high/critical not accepted in scripts/npm-audit.mjs)
        run: |
          (cd frontend && npm ci --ignore-scripts) && node scripts/npm-audit.mjs frontend
          (cd infra/email-worker && npm ci --ignore-scripts) && node scripts/npm-audit.mjs infra/email-worker
      - name: Bandit
        run: bandit -q -r backend/app backend/scripts alembic
      - name: Semgrep (default, Python, JavaScript)
        run: >-
          semgrep scan --config p/default --config p/python --config p/javascript --metrics=off --error
          --exclude node_modules --exclude venv --exclude dist --exclude dist-e2e --exclude frontend/public/ocr
          backend alembic frontend/src frontend/e2e frontend/vite.config.js frontend/index.html infra/email-worker/src scripts

  zap:
    name: OWASP ZAP (baseline on the app, API scan on the API)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: vaulta, POSTGRES_DB: postgres, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U vaulta" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_PYTHON: python
      E2E_DATABASE_URL: postgresql://vaulta@localhost:54329/vaulta_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: "backend/requirements*.txt" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements.txt
      - name: Start the API and the app (the browser-test servers, with the production headers)
        working-directory: frontend
        run: |
          npm ci
          python e2e/servers/backend.py > api.log 2>&1 &
          npx vite build --mode e2e --outDir dist-e2e
          npx vite preview --mode e2e --outDir dist-e2e --host 127.0.0.1 --port 4173 > web.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8001/health && curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 2; done
      - name: Let the ZAP container (user zap) write its reports here
        run: chmod a+w .
      - name: ZAP baseline, web app
        run: >-
          docker run --rm --network host -v "$PWD:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.17.0
          zap-baseline.py -t http://127.0.0.1:4173/welcome -c .zap/rules.tsv -r zap-app.html -m 2
      # DOM XSS needs a browser-rendered page; against a JSON API the rule only launches a browser and crashes ZAP
      - name: ZAP API scan, API (from its OpenAPI description)
        run: >-
          docker run --rm --network host -v "$PWD:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.17.0
          zap-api-scan.py -t http://127.0.0.1:8001/openapi.json -f openapi -c .zap/rules.tsv -r zap-api.html
          -z "-addonuninstall domxss"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: zap-reports, path: "zap-*.html", retention-days: 14 }
