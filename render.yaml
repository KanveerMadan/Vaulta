# Render Blueprint: the API web service, on Render's free plan, in Singapore (Render's region nearest India). The
# hourly run is a GitHub Actions schedule (.github/workflows/hourly-run.yml): Render's cron jobs aren't free.
# Values are never in this file: every variable marked `sync: false` is entered in the Render dashboard (or asked
# for when the Blueprint is first applied). docs/DEPLOY.md lists each one, where it's set and how to generate it.
# Migrations are not run here: they need the database owner's URL, which the API never gets (docs/go-live.md).
services:
  - type: web
    name: vaulta-api
    runtime: python
    region: singapore
    plan: free                          # 512 MB; sleeps after 15 idle minutes, and every caller waits for it
                                        # to start (docs/DEPLOY.md, Cold starts)
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One worker: a 12-month import peaks near 390 MB in one process (docs/ml/evaluation.md, an upper bound), so
    # two could pass the free plan's 512 MB. --proxy-headers so rate limits see the client's IP behind Render's proxy;
    # no access log (it would carry query strings; app/core/logs.py logs each request instead).
    startCommand: >-
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers ${WEB_CONCURRENCY:-1}
      --proxy-headers --forwarded-allow-ips='*' --no-access-log
    healthCheckPath: /health/ready      # database up, migrations at head, row-level security enforced
    autoDeploy: true                    # on, from main, since the launch (the dashboard holds the live setting)
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_URL               # the vaulta_app role (not the owner), pooled host
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: INTERNAL_SECRET
        sync: false
      - key: MASTER_KEY
        sync: false
      - key: BLIND_INDEX_KEY
        sync: false
      - key: MASTER_KEY_PREVIOUS        # only while a MASTER_KEY rotation runs; otherwise leave unset
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: BACKEND_CORS_ORIGIN_REGEX
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: SECURITY_CONTACT_EMAIL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: INBOUND_DOMAIN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_ID
        sync: false
