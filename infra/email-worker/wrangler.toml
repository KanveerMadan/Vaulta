# Cloudflare Email Worker for Vaulta's bank-alert forwarding addresses.
# See README.md for the full setup. Secrets are set with `wrangler secret put`.
name = "vaulta-inbound-email"
main = "src/worker.js"
compatibility_date = "2025-06-01"
# email only: no public workers.dev web address
workers_dev = false

[vars]
# Vaulta API base URL (no trailing slash)
API_URL = "https://api.vaulta.in"
# the only host this worker takes mail for (the catch-all covers the whole zone; everything else bounces)
INBOUND_HOST = "in.vaulta.in"

# INTERNAL_SECRET is a secret, not a var:
#   wrangler secret put INTERNAL_SECRET
